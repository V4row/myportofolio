<div id="add-model-modal"
     class="model-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-model-modal-title">
    <button type="button"
            class="model-form-modal__backdrop"
            popovertarget="add-model-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah pengalaman"></button>

    <div class="model-form-modal__content">
        <button type="button"
                class="model-form-modal__close"
                popovertarget="add-model-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah pengalaman">×</button>

        <h2 id="add-model-modal-title">Tambah Pengalaman Baru</h2>
        <form id="experience-form" class="model-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="model-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-model-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Pengalaman</button>
            </div>
        </form>
    </div>
</div>
