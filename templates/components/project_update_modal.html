<div id="update-project-modal"
     class="project-form-modal model-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="update-project-modal-title">
    <button type="button"
            class="project-form-modal__backdrop model-form-modal__backdrop"
            popovertarget="update-project-modal"
            popovertargetaction="hide"
            aria-label="Tutup form update proyek"></button>

    <div class="model-form-modal__content">
        <button type="button"
                class="project-form-modal__close model-form-modal__close"
                popovertarget="update-project-modal"
                popovertargetaction="hide"
                aria-label="Tutup form update proyek">×</button>

        <h2 id="update-project-modal-title">Update Proyek</h2>
        <form id="update-project-form" class="project-form model-form">
            <input type="hidden" name="id">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="update-{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions model-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="update-project-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan</button>
            </div>
        </form>
    </div>
</div>
