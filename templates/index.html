{% extends 'base.html' %}
{% block meta %}
    <title>{{ name }} - Portfolio</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="hero-bio">
                <div class="hero-top">
                    <p>Computer Science // Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>

                <div class="hero-bottom">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Gender</dt>
                            <dd>Male</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Status</dt>
                            <dd>Alive</dd>
                        </div>
                    </dl>

                    <div class="contact" id="contact">
                        <a href="https://github.com/V4row" class="social-link">GitHub</a>
                        <a href="https://linkedin.com/in/vebian-manurung" class="social-link">LinkedIn</a>
                        <a href="mailto:vnuw12@gmail.com" class="social-link">Email</a>
                    </div>

                </div>
            </div>

            <div class="hero-img">
                <img class="avatar" src="/static/img/isthisme.png" alt="Photo of Vebian">
            </div>
        </section>

    </main>
{% endblock content %}
